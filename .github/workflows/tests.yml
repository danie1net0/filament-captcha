name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [11.*, 12.*, 13.*]
        filament: [3.*, 4.*, 5.*]
        exclude:
          # Filament 3 only supports Laravel 11
          - filament: 3.*
            laravel: 12.*
          - filament: 3.*
            laravel: 13.*
          # Filament 4 supports Laravel 11 and 12
          - filament: 4.*
            laravel: 13.*
          # Filament 5 requires Laravel 12+
          - filament: 5.*
            laravel: 11.*
          # Laravel 13 requires PHP 8.3+
          - php: 8.2
            laravel: 13.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Filament ${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest
